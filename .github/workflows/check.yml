name: Tisch Checker

on:
  #schedule:
   # - cron: '*/13 * * * *' # Läuft alle 15 Minuten
  workflow_dispatch: # Erlaubt den manuellen Start über den "Run workflow" Button

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Wichtig: Damit der Bot die Status-Datei im Repo speichern darf
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright requests
          # Installiert den Chromium Browser
          python -m playwright install chromium
          # Installiert die notwendigen Linux-System-Bibliotheken (Schriften, Grafik-Support)
          python -m playwright install-deps chromium

      - name: Run Scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python oktoberfest-bot.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Sicherstellen, dass die Datei existiert, damit git add nicht fehlschlägt
          touch wiesn_status_3okt.txt
          
          git add wiesn_status_3okt.txt
          
          # Nur committen, wenn es wirklich Änderungen gibt
          git commit -m "Update reservation status" || echo "Keine Änderungen zum Committen"
          
          # Änderungen hochladen
          git push || echo "Nichts zum Pushen vorhanden"
