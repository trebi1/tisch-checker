name: Wiesn Playwright Checker

on:
  schedule:
    - cron: '*/15 * * * *' # Alle 15 Minuten
  workflow_dispatch: # Erlaubt manuelles Starten

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

     - name: Install Dependencies
        run: |
          pip install playwright requests
          # Wir nutzen "python -m playwright" statt nur "playwright"
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Run Scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python wiesn_checker.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Falls die Datei noch nicht existiert, leer anlegen
          touch wiesn_status_3okt.txt
          git add wiesn_status_3okt.txt
          git commit -m "Update status" || echo "No changes"
          git push || echo "Nothing to push"
