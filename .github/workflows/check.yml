name: Wiesn Playwright Checker

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # <-- Update auf v4 (behebt die Warnung)

      - name: Setup Python
        uses: actions/setup-python@v5 # <-- Update auf v5 (behebt die Warnung)
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Run Scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python wiesn_checker.py

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Stellt sicher, dass die Datei existiert, damit 'git add' nicht abstürzt
          touch wiesn_status_3okt.txt 
          git add wiesn_status_3okt.txt
          
          git commit -m "Update reservation status" || echo "No changes to commit"
          git push || echo "Nothing to push"
